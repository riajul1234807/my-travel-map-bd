<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার প্রোফাইল - My Travel Map Bangladesh</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7f4;
      color: #1b4332;
    }
    .top {
      background: #1b4332;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top a { color: #ffd166; text-decoration: none; font-weight: bold; }
    .box { max-width: 420px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #2d6a4f;
      color: white;
      font-size: 54px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      overflow: hidden;
      border: 4px solid #ffd166;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .photo-btn {
      display: inline-block;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #2d6a4f;
      color: white;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    h2 { margin: 6px 0; }
    .email { color: #52796f; margin: 0 0 18px; word-break: break-all; }
    label.lbl { display: block; text-align: left; margin: 12px 0 6px; font-weight: bold; }
    input[type=text] {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 2px solid #b7d4c4;
      border-radius: 10px;
    }
    .go {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: #ffd166;
      color: #1b4332;
      border: none;
      border-radius: 12px;
    }
    .out {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #b00020;
      border: 2px solid #b00020;
      border-radius: 12px;
    }
    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      display: none;
    }
    .msg.err { display: block; background: #ffe3e3; color: #b00020; }
    .msg.ok { display: block; background: #d8f3dc; color: #1b4332; }
    .loading { text-align: center; padding: 40px; font-size: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="top">
    <div>🗺️ My Travel Map BD</div>
    <a href="index.html">← হোম</a>
  </div>

  <div class="box">
    <div class="loading" id="loading">লোড হচ্ছে...</div>

    <div class="card hidden" id="profileCard">
      <div class="avatar" id="avatar">?</div>

      <label class="photo-btn" for="photoInput">📷 ছবি বদলান</label>
      <input type="file" id="photoInput" accept="image/*" class="hidden">

      <h2 id="nameShow">নাম</h2>
      <p class="email" id="emailShow"></p>

      <label class="lbl" for="nameInput">নাম বদলান</label>
      <input type="text" id="nameInput" placeholder="আপনার নাম">

      <button class="go" id="saveBtn">নাম Save করুন</button>
      <button class="out" id="logoutBtn">লগআউট</button>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwk4TYMysCQH7ALCrwRoxktLzpu8cWHbk",
      authDomain: "my-travel-map-bd.firebaseapp.com",
      projectId: "my-travel-map-bd",
      storageBucket: "my-travel-map-bd.firebasestorage.app",
      messagingSenderId: "16368257472",
      appId: "1:16368257472:web:c0fe502ab876dc5b99e025"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);

    function show(text, type) {
      const m = $("msg");
      m.textContent = text;
      m.className = "msg " + type;
    }

    function showAvatar(user, photo) {
      const name = user.displayName || "বন্ধু";
      const av = $("avatar");
      if (photo) {
        av.innerHTML = "";
        const img = document.createElement("img");
        img.src = photo;
        av.appendChild(img);
      } else {
        av.textContent = name.charAt(0).toUpperCase();
      }
    }

    function fill(user) {
      $("nameShow").textContent = user.displayName || "বন্ধু";
      $("emailShow").textContent = user.email;
      $("nameInput").value = user.displayName || "";
    }

    let currentPhoto = "";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      $("loading").classList.add("hidden");
      $("profileCard").classList.remove("hidden");
      fill(user);
      showAvatar(user, "");
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists() && snap.data().photo) {
          currentPhoto = snap.data().photo;
          showAvatar(user, currentPhoto);
        }
      } catch (e) {
        show("ছবি লোড করা যায়নি: " + e.code, "err");
      }
    });

    // ছবি ছোট করার ফাংশন (৩০০x৩০০, মাঝখান থেকে কাটা)
    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("read"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("img"));
          img.onload = () => {
            const size = 300;
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext("2d");
            const min = Math.min(img.width, img.height);
            const sx = (img.width - min) / 2;
            const sy = (img.height - min) / 2;
            ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    $("photoInput").addEventListener("change", async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        show("শুধু ছবি বেছে নিন।", "err");
        return;
      }
      show("ছবি আপলোড হচ্ছে...", "ok");
      try {
        const data = await resizeImage(file);
        await setDoc(doc(db, "users", auth.currentUser.uid), { photo: data }, { merge: true });
        currentPhoto = data;
        showAvatar(auth.currentUser, data);
        show("ছবি Save হয়েছে ✅", "ok");
      } catch (e) {
        show("ছবি Save হয়নি: " + (e.code || e.message), "err");
      }
      ev.target.value = "";
    });

    $("saveBtn").addEventListener("click", async () => {
      const newName = $("nameInput").value.trim();
      if (!newName) { show("নাম খালি রাখা যাবে না।", "err"); return; }
      $("saveBtn").disabled = true;
      try {
        await updateProfile(auth.currentUser, { displayName: newName });
        fill(auth.currentUser);
        showAvatar(auth.currentUser, currentPhoto);
        show("নাম Save হয়েছে ✅", "ok");
      } catch (e) {
        show("সমস্যা হয়েছে: " + e.code, "err");
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
