<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার প্রোফাইল - My Travel Map Bangladesh</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7f4;
      color: #1b4332;
    }
    .top {
      background: #1b4332;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top a { color: #ffd166; text-decoration: none; font-weight: bold; }
    .box { max-width: 420px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #2d6a4f;
      color: white;
      font-size: 44px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    h2 { margin: 6px 0; }
    .email { color: #52796f; margin: 0 0 18px; word-break: break-all; }
    label { display: block; text-align: left; margin: 12px 0 6px; font-weight: bold; }
    input {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 2px solid #b7d4c4;
      border-radius: 10px;
    }
    .go {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: #ffd166;
      color: #1b4332;
      border: none;
      border-radius: 12px;
    }
    .out {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      color: #b00020;
      border: 2px solid #b00020;
      border-radius: 12px;
    }
    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      display: none;
    }
    .msg.err { display: block; background: #ffe3e3; color: #b00020; }
    .msg.ok { display: block; background: #d8f3dc; color: #1b4332; }
    .loading { text-align: center; padding: 40px; font-size: 18px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="top">
    <div>🗺️ My Travel Map BD</div>
    <a href="index.html">← হোম</a>
  </div>

  <div class="box">
    <div class="loading" id="loading">লোড হচ্ছে...</div>

    <div class="card hidden" id="profileCard">
      <div class="avatar" id="avatar">?</div>
      <h2 id="nameShow">নাম</h2>
      <p class="email" id="emailShow"></p>

      <label for="nameInput">নাম বদলান</label>
      <input type="text" id="nameInput" placeholder="আপনার নাম">

      <button class="go" id="saveBtn">নাম Save করুন</button>
      <button class="out" id="logoutBtn">লগআউট</button>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwk4TYMysCQH7ALCrwRoxktLzpu8cWHbk",
      authDomain: "my-travel-map-bd.firebaseapp.com",
      projectId: "my-travel-map-bd",
      storageBucket: "my-travel-map-bd.firebasestorage.app",
      messagingSenderId: "16368257472",
      appId: "1:16368257472:web:c0fe502ab876dc5b99e025"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const $ = (id) => document.getElementById(id);

    function show(text, type) {
      const m = $("msg");
      m.textContent = text;
      m.className = "msg " + type;
    }

    function fill(user) {
      const name = user.displayName || "বন্ধু";
      $("nameShow").textContent = name;
      $("emailShow").textContent = user.email;
      $("nameInput").value = user.displayName || "";
      $("avatar").textContent = name.charAt(0).toUpperCase();
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      $("loading").classList.add("hidden");
      $("profileCard").classList.remove("hidden");
      fill(user);
    });

    $("saveBtn").addEventListener("click", async () => {
      const newName = $("nameInput").value.trim();
      if (!newName) { show("নাম খালি রাখা যাবে না।", "err"); return; }
      $("saveBtn").disabled = true;
      try {
        await updateProfile(auth.currentUser, { displayName: newName });
        fill(auth.currentUser);
        show("নাম Save হয়েছে ✅", "ok");
      } catch (e) {
        show("সমস্যা হয়েছে: " + e.code, "err");
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
